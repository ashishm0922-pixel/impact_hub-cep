<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard — HopeConnect AI</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="../assets/css/style.css?v=14">
  <link rel="stylesheet" href="../assets/css/responsive.css?v=14">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="../index.html" class="brand-logo">
        <div class="logo-icon"><i class="fas fa-hand-holding-heart"></i></div>
        <span>HopeConnect<span class="ai-badge">AI</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="ngos.html">Discover NGOs</a></li>
        <li><a href="volunteer.html">Volunteer</a></li>
        <li><a href="campaigns.html">Campaigns</a></li>
        <li><a href="impact.html">Impact</a></li>
        <li><a href="rewards.html">Rewards</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <div class="auth-area" id="authArea"></div>
        <button class="mobile-menu-btn" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
      </div>
    </div>
  </header>

  <main class="dash-shell" id="dashboardPage">
    <!-- Who is logged in -->
    <section class="dash-profile" id="dashProfile" aria-live="polite">
      <div class="dash-loading"><i class="fas fa-spinner fa-spin"></i> Loading your dashboard...</div>
    </section>

    <!-- Filled in by assets/js/pages/dashboard.js, depending on your role -->
    <div id="dashContent"></div>
  </main>

  <!-- Create Campaign Modal -->
  <div class="modal-backdrop" id="createCampaignModal">
    <div class="modal-card" style="max-width: 620px;" role="dialog" aria-modal="true" aria-labelledby="createCampaignTitle">
      <div class="modal-header">
        <h3 id="createCampaignTitle"><i class="fas fa-bullhorn" style="color: var(--accent-orange);"></i> Create New Campaign</h3>
        <button class="modal-close-btn" aria-label="Close">&times;</button>
      </div>
      <form id="createCampaignForm" novalidate>
        <div class="modal-body">
          <div class="form-group">
            <label for="newCampTitle">Campaign Title *</label>
            <input type="text" class="form-control" id="newCampTitle" maxlength="100" placeholder="e.g. Rural Solar Light Installation in 5 Villages">
          </div>
          <div class="stack-mobile" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="newCampCategory">Category *</label>
              <select class="form-control hc-category-select" id="newCampCategory"></select>
            </div>
            <div class="form-group">
              <label for="newCampGoal">Fundraising Goal (₹) *</label>
              <input type="number" class="form-control" id="newCampGoal" placeholder="75000" min="1000" max="10000000" inputmode="numeric">
            </div>
          </div>
          <div class="stack-mobile" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="newCampLocation">Location / City *</label>
              <input type="text" class="form-control" id="newCampLocation" maxlength="80" placeholder="e.g. Pune & Satara District">
            </div>
            <div class="form-group">
              <label for="newCampEndDate">End Date *</label>
              <input type="date" class="form-control" id="newCampEndDate">
            </div>
          </div>
          <div class="form-group">
            <label for="newCampImage">Cover Image URL (optional, https only)</label>
            <input type="url" class="form-control" id="newCampImage" placeholder="https://images.unsplash.com/photo-...">
          </div>
          <div class="form-group">
            <label for="newCampDescription">Description *</label>
            <textarea class="form-control" id="newCampDescription" maxlength="600" placeholder="Explain the community challenge, beneficiaries, and milestones (at least 30 characters)..." rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('createCampaignModal')">Cancel</button>
          <button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Publish Campaign</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Create Opportunity Modal -->
  <div class="modal-backdrop" id="createOpportunityModal">
    <div class="modal-card" style="max-width: 620px;" role="dialog" aria-modal="true" aria-labelledby="createOppTitle">
      <div class="modal-header">
        <h3 id="createOppTitle"><i class="fas fa-calendar-plus" style="color: var(--accent-green);"></i> Create Volunteer Drive</h3>
        <button class="modal-close-btn" aria-label="Close">&times;</button>
      </div>
      <form id="createOpportunityForm" novalidate>
        <div class="modal-body">
          <div class="form-group">
            <label for="newOppTitle">Drive Title *</label>
            <input type="text" class="form-control" id="newOppTitle" maxlength="100" placeholder="e.g. Lake Clean-up at Pashan">
          </div>
          <div class="stack-mobile" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="newOppCategory">Category *</label>
              <select class="form-control hc-category-select" id="newOppCategory"></select>
            </div>
            <div class="form-group">
              <label for="newOppDate">Date *</label>
              <input type="date" class="form-control" id="newOppDate">
            </div>
          </div>
          <div class="stack-mobile" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="newOppCity">City *</label>
              <input type="text" class="form-control" id="newOppCity" maxlength="40" placeholder="e.g. Pune">
            </div>
            <div class="form-group">
              <label for="newOppVenue">Venue / Area</label>
              <input type="text" class="form-control" id="newOppVenue" maxlength="60" placeholder="e.g. Pashan Lake">
            </div>
          </div>
          <div class="stack-mobile" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="newOppNeeded">Volunteers Needed *</label>
              <input type="number" class="form-control" id="newOppNeeded" min="1" max="500" value="10" inputmode="numeric">
            </div>
            <div class="form-group">
              <label for="newOppHours">Hours *</label>
              <input type="number" class="form-control" id="newOppHours" min="1" max="12" value="3" inputmode="numeric">
            </div>
            <div class="form-group">
              <label for="newOppAvailability">Timing</label>
              <select class="form-control" id="newOppAvailability">
                <option value="Weekends">Weekends</option>
                <option value="Weekdays">Weekdays</option>
                <option value="Weekday Evenings">Weekday Evenings</option>
                <option value="Flexible">Flexible</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="newOppSkills">Helpful Skills (comma separated)</label>
            <input type="text" class="form-control" id="newOppSkills" maxlength="150" placeholder="e.g. teamwork, physical work, photography">
          </div>
          <div class="form-group">
            <label style="display: flex; gap: 0.5rem; align-items: center; font-weight: 500;">
              <input type="checkbox" id="newOppRemote"> Can be done remotely / online
            </label>
          </div>
          <div class="form-group">
            <label for="newOppDescription">Description *</label>
            <textarea class="form-control" id="newOppDescription" maxlength="500" rows="3" placeholder="What will volunteers do? What should they bring? (at least 30 characters)"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('createOpportunityModal')">Cancel</button>
          <button type="submit" class="btn btn-green"><i class="fas fa-check"></i> Publish Drive</button>
        </div>
      </form>
    </div>
  </div>


  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <span>&copy; 2026 HopeConnect AI. All rights reserved.</span>
        <span>My Dashboard</span>
      </div>
    </div>
  </footer>

  <script src="../assets/js/core/constants.js?v=14"></script>

  <script src="../assets/js/pages/dashboard.js?v=14"></script>
</body>
</html>
