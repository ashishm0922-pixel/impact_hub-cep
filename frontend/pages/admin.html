<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Panel — HopeConnect AI</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="../assets/css/style.css?v=5">
  <link rel="stylesheet" href="../assets/css/responsive.css?v=5">
</head>
<body>

  <header class="site-header">
    <div class="container nav-container">
      <a href="../index.html" class="brand-logo">
        <div class="logo-icon"><i class="fas fa-hand-holding-heart"></i></div>
        <span>HopeConnect<span class="ai-badge">Admin</span></span>
      </a>
      <div class="nav-actions">
        <span class="auth-chip" id="adminChip" hidden><i class="fas fa-user-shield"></i> <span id="adminName"></span></span>
        <button type="button" class="btn btn-sm btn-outline" id="adminLogoutBtn" hidden><i class="fas fa-sign-out-alt"></i> Logout</button>
        <a href="../index.html" class="btn btn-sm btn-secondary"><i class="fas fa-arrow-left"></i> Website</a>
      </div>
    </div>
  </header>

  <main class="admin-shell">

    <!-- Checking session -->
    <div id="adminLoading" style="text-align: center; padding: 4rem 0; color: var(--text-muted);">
      <i class="fas fa-spinner fa-spin"></i> Checking admin session...
    </div>

    <!-- Login -->
    <section id="adminLoginView" class="admin-login-card" hidden aria-labelledby="adminLoginTitle">
      <h2 id="adminLoginTitle" style="font-size: 1.4rem; margin-bottom: 0.25rem;"><i class="fas fa-user-shield" style="color: var(--accent-gold-hover);"></i> Admin login</h2>
      <p style="font-size: 0.9rem; margin-bottom: 1.25rem;">Only HopeConnect administrators can sign in here.</p>
      <form id="adminLoginForm" novalidate>
        <div class="form-alert" id="adminLoginAlert" role="alert" hidden></div>
        <div class="form-group">
          <label for="adminUsername">Username</label>
          <input type="text" class="form-control" id="adminUsername" autocomplete="username" maxlength="32" autocapitalize="none" spellcheck="false">
        </div>
        <div class="form-group">
          <label for="adminPassword">Password</label>
          <div class="password-wrap">
            <input type="password" class="form-control" id="adminPassword" autocomplete="current-password" maxlength="128">
            <button type="button" class="password-toggle" id="adminPasswordToggle" aria-label="Show password" title="Show password"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fas fa-sign-in-alt"></i> Login</button>
      </form>
    </section>

    <!-- Panel -->
    <section id="adminPanelView" hidden aria-labelledby="adminPanelTitle">
      <div class="admin-topbar">
        <div>
          <h2 id="adminPanelTitle" style="margin-bottom: 0.2rem;">User approvals</h2>
          <p style="font-size: 0.9rem; margin: 0;">New accounts can't log in until you approve them.</p>
        </div>
        <button type="button" class="btn btn-sm btn-outline" id="adminRefreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
      </div>

      <div class="admin-status-tabs" id="adminStatusTabs" role="tablist" aria-label="Filter users by status">
        <button type="button" class="admin-status-tab active" data-status="pending"><strong data-count="pending">0</strong><span>⏳ Pending</span></button>
        <button type="button" class="admin-status-tab" data-status="approved"><strong data-count="approved">0</strong><span>✅ Approved</span></button>
        <button type="button" class="admin-status-tab" data-status="rejected"><strong data-count="rejected">0</strong><span>❌ Rejected</span></button>
        <button type="button" class="admin-status-tab" data-status="suspended"><strong data-count="suspended">0</strong><span>⛔ Suspended</span></button>
        <button type="button" class="admin-status-tab" data-status=""><strong data-count="all">0</strong><span>👥 All users</span></button>
      </div>

      <div class="admin-toolbar">
        <input type="search" class="form-control" id="adminSearch" placeholder="Search name, email or mobile..." maxlength="100" aria-label="Search users">
      </div>

      <div class="data-table-container">
        <div class="table-scroll">
          <table class="custom-table">
            <thead>
              <tr><th>User</th><th>Mobile</th><th>Role</th><th>Signed up</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="adminUsersBody"></tbody>
          </table>
        </div>
        <div class="admin-pagination">
          <span id="adminPageInfo"></span>
          <button type="button" class="btn btn-xs btn-outline" id="adminPrevPage">‹ Prev</button>
          <button type="button" class="btn btn-xs btn-outline" id="adminNextPage">Next ›</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Reason modal (reject / suspend) -->
  <div class="modal-backdrop" id="reasonModal">
    <div class="modal-card" style="max-width: 440px;" role="dialog" aria-modal="true" aria-labelledby="reasonTitle">
      <div class="modal-header">
        <h3 id="reasonTitle" style="font-size: 1.15rem;">Reason</h3>
        <button class="modal-close-btn" aria-label="Close">&times;</button>
      </div>
      <form id="reasonForm" novalidate>
        <div class="modal-body">
          <p id="reasonIntro" style="font-size: 0.9rem;"></p>
          <div class="form-group">
            <label for="reasonText">Reason (shown to the user when they try to log in) *</label>
            <textarea class="form-control" id="reasonText" rows="3" maxlength="200"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('reasonModal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="reasonSubmit">Confirm</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts (no auth.js here: admins use a separate login) -->
  <script src="../assets/js/core/seed-data.js?v=5"></script>
  <script src="../assets/js/core/store.js?v=5"></script>
  <script src="../assets/js/core/app.js?v=5"></script>
  <script src="../assets/js/pages/admin.js?v=5"></script>
</body>
</html>
